# Configuration du plugin. Les textes affichés aux joueurs sont dans messages.yml.
# Les changements demandent un redémarrage, sauf le loot (/loot recharger).
# /config écrit ses modifications dans ce fichier, section maps.

lobby:
  # true : point de spawn du monde principal. false : coordonnées ci-dessous.
  use-world-spawn: true
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

match:
  min-players: 2
  min-teams: 2
  countdown-seconds: 10
  # Délai entre la fin de partie et le retour au lobby.
  end-delay-seconds: 20
  # Heure du monde au lancement, en ticks (1000 = matin).
  start-time: 1000
  top-kills: 10

border:
  # Taille finale = max(final-size-min, diamètre de départ x final-size-ratio).
  final-size-ratio: 0.25
  final-size-min: 20.0
  damage-buffer: 5.0
  damage-per-second: 0.5
  warning-distance: 10
  warning-time: 15
  slow-multiplier: 2.0
  # Vitesses de /bordure et /max, en blocs par seconde.
  speed:
    fast: 1.0
    very-fast: 1.5
    extreme: 2.0
    max: 3.0

teams:
  # Nom automatique d'une équipe, {n} est son numéro.
  name-format: "District {n}"
  random-colors: [BLUE, GREEN, YELLOW, AQUA, LIGHT_PURPLE, GOLD, DARK_GREEN, DARK_AQUA, DARK_PURPLE, WHITE]
  refusal-cooldown-seconds: 30
  # Réapparition d'un joueur mort tant que son coéquipier survit.
  revive-delay-seconds: 90
  revive-sweep-seconds: 120

combat-tag:
  tag-seconds: 30
  disconnect-timeout-seconds: 60
  # En dessous de ce nombre de points de vie (2 = 1 cœur), une déconnexion en combat élimine aussitôt.
  instant-elimination-health: 8.0

airdrops:
  manual-radius: 15

classes:
  cooldown-seconds: 180
  bounty-seconds: 180

reset:
  auto-after-match: false

# Valeurs reprises par chaque map, qui peut redéfinir n'importe laquelle dans sa propre section.
map-defaults:
  chests:
    total: 115
    center-percent: 22
    scatter-radius: 200
    cluster-radius: 20
  # Poids relatifs, pas besoin que le total fasse 100.
  rarity-weights:
    COMMUN: 38
    PEU_COMMUN: 25
    RARE: 18
    EPIQUE: 12
    LEGENDAIRE: 7
    LARGAGE: 0
  border:
    shrink-delay-seconds: 300
  match:
    max-duration-seconds: 2700
  airdrops:
    interval-seconds: 600
    first-delay-seconds: 300
    player-radius: 50

# Chaque clé est le nom du dossier du monde, à la racine du serveur.
# Y correspond au niveau des pieds, tel qu'affiché par F3.
maps:
  arena:
    name: "&cArène"
    icon: RED_WOOL
    center:
      x: 0.0
      y: 64.0
      z: 0.0
    # Rayon du cercle sur lequel les équipes apparaissent.
    spawn-radius: 40.0
    # Rayon de la bordure au départ.
    border-radius: 200.0
    # Dossier copié par /resetmap, à la racine du serveur. Laisser vide pour désactiver.
    backup-folder: arena_backup
    load-on-start: true
    # Facultatif : centres distincts du centre de la map.
    # chests:
    #   scatter-center: {x: 0.0, y: 64.0, z: 0.0}
    #   cluster-center: {x: 0.0, y: 64.0, z: 0.0}

